apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Must apply before the `android {}` block below — that's what registers the
// `firebaseAppDistribution {}` DSL used inside buildTypes.debug, and Gradle
// evaluates that block eagerly at this point in the file.
def hasAppDistributionCreds = file('firebase-service-account.json').exists()
if (hasAppDistributionCreds) {
    apply plugin: 'com.google.firebase.appdistribution'
} else {
    logger.info("firebase-service-account.json not found, App Distribution plugin not applied. `appDistributionUploadDebug` won't be available")
}

android {
    namespace = "com.colebeing.ping"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.colebeing.ping"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (hasAppDistributionCreds) {
                firebaseAppDistribution {
                    serviceCredentialsFile = "$projectDir/firebase-service-account.json"
                    releaseNotes = "Debug build from ${new Date().format('yyyy-MM-dd HH:mm')}"
                    // Requires a "testers" group to already exist in App Distribution (Firebase
                    // Console → App Distribution → Testers & Groups → New group) — a build still
                    // uploads fine without it, this step just gets silently skipped until then.
                    groups = "testers"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // capacitor.build.gradle (auto-generated, applied after this block) hardcodes Java to 21 and
    // always will on every `cap sync` — match Kotlin to that rather than fighting it here.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // EncryptedSharedPreferences, for the device token NotificationActionReceiver authenticates with.
    implementation "androidx.security:security-crypto:1.1.0"
    // @capacitor/push-notifications declares this with Gradle's `implementation` scope, which keeps
    // it private to that module rather than exposing it transitively — app needs its own reference
    // (matching push-notifications' own pinned version, so only one copy resolves on the classpath).
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
