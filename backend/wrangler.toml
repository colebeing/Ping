name = "ping-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# @block65/webcrypto-web-push falls back to node:crypto in some code paths.
compatibility_flags = ["nodejs_compat"]

# Runs hourly; the scheduled handler checks each user's own cadence
# (default 11am / 11pm, per-user timezone) and only sends what's due.
[triggers]
crons = ["0 * * * *"]

# Create these with `wrangler kv namespace create CONFIG_KV` / `STATE_KV`,
# then replace the ids below.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "1f376b12ca9540a083cdae487f5d0a5c"

[[kv_namespaces]]
binding = "STATE_KV"
id = "3869129cae394626997c4d6a2501c030"

# Secrets (set via `wrangler secret put <NAME>`, not stored here):
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (e.g. "mailto:you@example.com")
#   SESSION_SECRET (any random string, used to namespace/rotate sessions if needed)
