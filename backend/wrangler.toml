name = "ping-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# @block65/webcrypto-web-push falls back to node:crypto in some code paths.
compatibility_flags = ["nodejs_compat"]

# Create these with `wrangler kv namespace create CONFIG_KV` / `STATE_KV`,
# then replace the ids below.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "1f376b12ca9540a083cdae487f5d0a5c"

[[kv_namespaces]]
binding = "STATE_KV"
id = "3869129cae394626997c4d6a2501c030"

# One Durable Object per user, alarmed for their exact next check-in time.
# (Cron Triggers are NOT used for push scheduling: they registered correctly
# via both the dashboard and API but never actually executed on this account
# across three tested schedules — a Cloudflare-side issue, not a config one.)
[[durable_objects.bindings]]
name = "PUSH_SCHEDULER"
class_name = "PushScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushScheduler"]

# Secrets (set via `wrangler secret put <NAME>`, not stored here):
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (e.g. "mailto:you@example.com")
#   SESSION_SECRET (any random string, used to namespace/rotate sessions if needed)
