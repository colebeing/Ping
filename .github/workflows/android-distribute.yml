name: Distribute Android build

# Builds the Capacitor Android wrapper (frontend/android) and uploads the debug APK straight to
# Firebase App Distribution on every push to main that touches it — the automatic version of what
# was, until now, a manual `./gradlew appDistributionUploadDebug` someone had to remember to run.
# Requires the FIREBASE_SERVICE_ACCOUNT_JSON repo secret (the same service account
# frontend/android/app/firebase-service-account.json holds locally, gitignored since it's a real
# secret) — without it, the credential-writing and upload steps are skipped rather than failing
# loudly on every push (e.g. a fork's build still runs, just without this part).

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/capacitor.config.ts"
      - ".github/workflows/android-distribute.yml"
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    # `secrets` isn't a recognized named-value inside `if:` expressions (GitHub Actions rejects the
    # whole workflow file if it's referenced there) — mirrored into a job-level env var instead, which
    # `if:` can read via the `env` context, and which every step's shell already inherits for free.
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE: https://ping-backend.colebeing.workers.dev

      - name: Sync Capacitor Android platform
        working-directory: frontend
        run: npx cap sync android

      # Gradle 9.5 / AGP 9.3.2 need JDK 17+; Temurin 21 matches what's verified working locally.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No separate Android SDK setup step — ubuntu-latest's runner image ships one preinstalled
      # (see actions/runner-images), and android-actions/setup-android@v3's own default `packages`
      # input requests the long-deprecated standalone 'tools' package, which no longer exists in
      # Google's SDK repository and fails the whole step outright. Gradle/AGP can download whatever
      # specific platform/build-tools version it still needs on demand, using the preinstalled SDK's
      # already-accepted licenses.
      - name: Write Firebase service account credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: frontend/android/app
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

      - name: Build and upload to Firebase App Distribution
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: frontend/android
        # appDistributionUploadDebug alone fails "Could not find an APK file for this variant" on a
        # clean checkout — its dependency on assembleDebug isn't reliably wired, so it's spelled out
        # explicitly here. Worked as just the upload task locally, where a previous build's output was
        # presumably still sitting around from earlier local runs.
        run: ./gradlew assembleDebug appDistributionUploadDebug
